name: Update Iraq offline map

# يشتغل أول كل شهر، ويقدر تشغّله يدوياً من تبويب Actions
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "أعد البناء حتى لو ما في بناء جديد"
        type: boolean
        default: false

permissions:
  contents: write

env:
  BBOX: "38.7,28.9,48.8,37.4"   # كل العراق: غرب,جنوب,شرق,شمال
  MAXZOOM: "15"
  PART_SIZE: "45M"              # كل جزء أقل من حد GitHub (100 م.ب)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install pmtiles
        run: |
          url=$(curl -fsSL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | jq -r '.assets[] | select(.name|test("Linux_x86_64.tar.gz$")) | .browser_download_url')
          curl -fsSL "$url" | tar xz pmtiles
          ./pmtiles version

      - name: Find latest Protomaps build
        id: b
        run: |
          for i in 0 1 2 3 4 5 6; do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -fsI "https://build.protomaps.com/$d.pmtiles" >/dev/null; then
              echo "date=$d" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "no build found in the last 7 days" >&2; exit 1

      - name: Is it new?
        id: chk
        run: |
          cur=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/maps/manifest.json" 2>/dev/null | jq -r '.version' || echo none)
          echo "current=$cur new=${{ steps.b.outputs.date }}"
          if [ "$cur" = "${{ steps.b.outputs.date }}" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Iraq
        if: steps.chk.outputs.skip != '1'
        run: |
          ./pmtiles extract "https://build.protomaps.com/${{ steps.b.outputs.date }}.pmtiles" iraq.pmtiles \
            --bbox="$BBOX" --maxzoom="$MAXZOOM"
          ls -lh iraq.pmtiles

      - name: Split and write manifest
        if: steps.chk.outputs.skip != '1'
        run: |
          mkdir out
          split -b "$PART_SIZE" -d -a 3 iraq.pmtiles out/part-
          cd out
          jq -n --arg v "${{ steps.b.outputs.date }}" --argjson size "$(stat -c %s ../iraq.pmtiles)" \
            --argjson ps "$(numfmt --from=iec ${PART_SIZE})" \
            --argjson parts "$(for f in part-*; do printf '{"n":"%s","size":%s,"sha256":"%s"}\n' "$f" "$(stat -c %s $f)" "$(sha256sum $f | cut -d' ' -f1)"; done | jq -s .)" \
            '{version:$v,size:$size,partSize:$ps,parts:$parts}' > manifest.json
          cat manifest.json | head -c 600

      - name: Publish to maps branch
        if: steps.chk.outputs.skip != '1'
        run: |
          cd out
          git init -q -b maps
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -qm "Iraq map ${{ steps.b.outputs.date }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" maps
